name: chain
services:
  postgres:
    image: postgres:${POSTGRES_TAG}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CORE_OWNER_PASSWORD: ${CORE_OWNER_PASSWORD}
      CORE_APP_PASSWORD: ${CORE_APP_PASSWORD}
      SYNC_OWNER_PASSWORD: ${SYNC_OWNER_PASSWORD}
      SYNC_APP_PASSWORD: ${SYNC_APP_PASSWORD}
      INGEST_OWNER_PASSWORD: ${INGEST_OWNER_PASSWORD}
      INGEST_APP_PASSWORD: ${INGEST_APP_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
  redis:
    image: redis:${REDIS_TAG}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG}
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 1g
volumes:
  pgdata: